name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "figs/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      # Figures and the explorer are generated by examples/ and committed; the site
      # only publishes them, so a docs build never re-runs a long computation.
      - name: Build site
        run: |
          mkdir -p docs/figs
          cp figs/*.svg docs/figs/
          mkdocs build --strict -d site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
