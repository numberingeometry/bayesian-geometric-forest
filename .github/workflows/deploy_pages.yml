name: Deploy Interactive Visualizer & GitHub Pages Documentation

on:
  push:
    branches:
      - main
    paths:
      - "bgforest/**"
      - "examples/**"
      - "docs/**"
      - "figs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Package and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]" mkdocs mkdocs-material

      - name: Run Test Suite
        run: |
          python -m pytest tests/

      - name: Generate Figures and Interactive HTML Visualizers
        run: |
          python examples/00_literature_taxonomy.py
          python examples/01_synthetic_benchmarks.py
          python examples/02_scrna_clustering.py
          python examples/03_mcmc_diagnostics.py
          python examples/04_interactive_viz.py
          python examples/05_bayesian_spanning_tree.py
          python examples/06_distance_clustering.py
          python examples/07_semi_supervised_bsf.py
          python examples/08_central_visualizer.py
          mkdir -p docs/figs
          cp -r figs/* docs/figs/

      - name: Build MkDocs Documentation Site
        run: |
          mkdocs build -d site
          mkdir -p site/figs
          cp -r figs/* site/figs/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifacts for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
