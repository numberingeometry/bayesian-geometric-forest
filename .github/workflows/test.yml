name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tooling
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check bgforest tests scripts examples
      - name: Unit tests
        run: python -m pytest --cov=bgforest --cov-report=term-missing
      - name: Exactness checks against brute-force enumeration
        run: python scripts/verify_exactness.py
      - name: Build distribution
        run: python -m build
