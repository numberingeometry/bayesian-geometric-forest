site_name: bayesian-geometric-forest
site_description: Reproducible probabilistic trees, forest clustering, graph geometry, and transparent benchmarks.
site_author: Bobby Zhang
site_url: https://numberingeometry.github.io/bayesian-geometric-forest/
repo_url: https://github.com/numberingeometry/bayesian-geometric-forest
repo_name: numberingeometry/bayesian-geometric-forest

theme:
  name: material
  font: false
  icon:
    logo: material/tree-outline
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/vendor/tex-svg.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Explore: https://numberingeometry.github.io/bayesian-geometric-forest/explorer/
  - Reference:
      - Model and mathematics: theory.md
      - Benchmarks: benchmarks.md
      - Verification: verification.md
      - Python API: api.md
      - Release notes: releases.md
