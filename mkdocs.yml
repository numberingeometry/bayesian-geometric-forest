site_name: Bayesian Geometric Forest
site_description: Bayesian Spanning Forest and Forest Process for Robust Graphical Model-Based Spectral Clustering
site_author: Bobby Zhang
repo_url: https://github.com/numberingeometry/bayesian-geometric-forest

theme:
  name: material
  palette:
    primary: indigo
    accent: blue

plugins:
  - search

markdown_extensions:
  - mathjax:
      javascript_status: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: README.md
  - Execution Plan: PLAN.md
  - Theory & Mathematics: docs/theory.md
