[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-geometric-forest"
version = "0.2.0"
description = "Bayesian Spanning Forest and Forest Process for Graphical Model-Based Robust Clustering"
readme = "README.md"
authors = [
    { name = "Bobby Zhang", email = "chelseaandmadrid@gmail.com" }
]
license = "MIT"
keywords = ["bayesian inference", "clustering", "graphs", "spanning forests", "uncertainty quantification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
    "pandas>=1.3.0",
    "networkx>=2.6.0",
]

[project.urls]
Homepage = "https://numberingeometry.github.io/bayesian-geometric-forest/"
Documentation = "https://numberingeometry.github.io/bayesian-geometric-forest/"
Repository = "https://github.com/numberingeometry/bayesian-geometric-forest"
Issues = "https://github.com/numberingeometry/bayesian-geometric-forest/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bgforest*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
