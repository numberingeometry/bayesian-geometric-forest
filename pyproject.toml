[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-geometric-forest"
version = "0.3.0"
description = "Bayesian spanning forest clustering (Duan & Roy, JASA 2024) with exact posterior tree draws, closed-form edge probabilities and brute-force verification."
readme = "README.md"
authors = [
    { name = "Bobby Zhang", email = "chelseaandmadrid@gmail.com" }
]
license = "MIT"
keywords = ["bayesian inference", "clustering", "spanning trees", "spanning forests", "uncertainty quantification", "wilson algorithm", "matrix-tree theorem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-learn>=1.1",
    "matplotlib>=3.5.0",
]

[project.urls]
Homepage = "https://numberingeometry.github.io/bayesian-geometric-forest/"
Documentation = "https://numberingeometry.github.io/bayesian-geometric-forest/"
Repository = "https://github.com/numberingeometry/bayesian-geometric-forest"
Issues = "https://github.com/numberingeometry/bayesian-geometric-forest/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bgforest*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
